/* =========================================================
   LÓGICA DEL QUIZ
========================================================== */
let current = 0;
const scores = {}; // tag -> puntos acumulados

function startQuiz(){
  current = 0;
  for (const k in scores) delete scores[k];
  document.getElementById("screen-start").classList.add("hidden");
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-quiz").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  const total = questions.length;
  const item = questions[current];
  document.getElementById("q-counter").textContent = `PREGUNTA ${current+1}/${total}`;
  document.getElementById("progress-fill").style.width = `${((current+1)/total)*100}%`;
  document.getElementById("q-text").textContent = item.q;

  const wrap = document.getElementById("q-options");
  wrap.innerHTML = "";
  item.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.t;
    btn.onclick = () => answer(opt.tags);
    wrap.appendChild(btn);
  });
}

function answer(tags){
  tags.forEach(t => { scores[t] = (scores[t] || 0) + 1; });
  current++;
  if (current < questions.length){
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  // calcular puntaje de cada jugador según sus tags
  let best = null;
  let bestScore = -1;
  const ranked = players.map(p => {
    const s = p.tags.reduce((acc,t) => acc + (scores[t] || 0), 0);
    return { p, s };
  });
  ranked.sort((a,b) => b.s - a.s);
  // desempate: entre los que están dentro de 1 punto del máximo, elegir aleatorio
  const top = ranked[0].s;
  const contenders = ranked.filter(r => r.s >= top - 0.001 && r.s === top);
  const winner = contenders[Math.floor(Math.random()*contenders.length)].p;

  document.getElementById("r-number").textContent = winner.number;
  document.getElementById("r-name").textContent = winner.name;
  document.getElementById("r-pos").textContent = winner.pos;
  document.getElementById("r-desc").textContent = winner.desc;

  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-result").classList.remove("hidden");
}

function restartQuiz(){
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-start").classList.remove("hidden");
}
</script>
</body>
